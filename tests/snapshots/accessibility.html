<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Accessibility</title><style>@layer hl-reset,hl-kind,hl-inside,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}:where([class^="hl-"],[class*=" hl-"]):where(a,button,input,select,textarea):focus-visible{outline:2px solid currentColor;outline-offset:2px}}@layer hl-kind{:where(.hl-a){display:block;}:where(.hl-b){display:flex;flex-direction:column;}:where(.hl-c){text-decoration:none;color:inherit;}}@layer htmlang{.hl-a{width:200px;}}</style></head><body><img src="https://example.com/sunset.jpg" class="hl-a" alt="A photo of sunset"><div class="hl-b" role="navigation" aria-label="Main menu"><a href="/" class="hl-c" tabindex="0" aria-current="page">Home</a><a href="/about" class="hl-c" tabindex="0">About</a></div><button aria-pressed="false" data-action="toggle">Toggle</button></body></html>
