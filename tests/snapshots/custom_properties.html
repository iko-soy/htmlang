<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Custom properties</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}:where([class^="hl-"],[class*=" hl-"]):where(a,button,input,select,textarea):focus-visible{outline:2px solid currentColor;outline-offset:2px}}:root{--ink:#0f172a;--surface:white;--subtle:#f8fafc;--radius:8px;}@layer htmlang{:where(.hl-b,.hl-c,.hl-d,.hl-k,.hl-l,.hl-m){display:flex;flex-direction:column;}:where(.hl-e){display:grid;}:where(.hl-f){text-decoration:none;color:inherit;}:where(.hl-g){display:flex;flex-direction:row;}:where(.hl-i){margin:0;}.hl-a{color:var(--ink);background:var(--surface);}.hl-b{padding:96px 24px;background:var(--subtle);}.hl-c{padding:24px;background:var(--surface);border-radius:var(--radius);}.hl-d{--gap:16px;gap:var(--gap);}.hl-e{--cols:3;--hue:200;grid-template-columns:repeat(var(--cols), 1fr);background:hsl(var(--hue) 80% 95%);}.hl-f{--underline:2px;text-decoration-thickness:var(--underline);}.hl-h{padding:var(--pad);}.hl-j{--weight:800;font-weight:var(--weight);}.hl-k{padding:8px;--tint:#fef3c7;background:var(--tint);}.hl-l{-webkit-text-stroke:1px black;-webkit-tap-highlight-color:transparent;}.hl-m{fill:currentColor;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-dasharray:4 2;}.hl-g:has(img){--pad:8px;}.hl-g:focus-within{--ring:#3b82f6;}.hl-f:hover{--underline:4px;}:where(.hl-g)>*{--pad:4px;}@media(min-width:768px){.hl-d{--gap:24px;}}@media(prefers-color-scheme:dark){.hl-a{--ink:#e2e8f0;--surface:#0b1220;--subtle:#111a2e;}.hl-k{--tint:#422006;}}@media print{.hl-g{--pad:0;}}}</style></head><body class="hl-a"><section class="hl-b"><article class="hl-c"><span>Both follow dark mode, from the one place that sets it.</span></article></section><div class="hl-d"><span>One</span><span>Two</span></div><div class="hl-e"><span>a</span><span>b</span><span>c</span></div><a href="/about" class="hl-f">About</a><div class="hl-g"><span class="hl-h">x</span></div><p class="hl-i">Some <strong class="hl-j">inline</strong> text</p><div class="hl-k"><span>Tinted</span></div><div class="hl-l"><span>Stroked</span></div><div class="hl-m"><span>Drawn</span></div></body></html>
