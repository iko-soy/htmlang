<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grid Areas</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{flex-direction:column;display:grid;grid-template-areas:"header header" "sidebar main" "footer footer";gap:20px;}.b{display:flex;flex-direction:column;grid-area:header;padding:10px;background:#3b82f6;color:white;}.c{display:flex;flex-direction:column;grid-area:sidebar;padding:10px;background:#e5e7eb;}.d{display:flex;flex-direction:column;grid-area:main;padding:10px;}.e{display:flex;flex-direction:column;grid-area:footer;padding:10px;background:#1a1a2e;color:white;}}</style></head><body><div class="a"><div class="b"><span>Header</span></div><div class="c"><span>Sidebar</span></div><div class="d"><span>Main content</span></div><div class="e"><span>Footer</span></div></div></body></html>
