<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grid Areas</title><style>@layer hl-reset,hl-kind,hl-inside,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer hl-kind{:where(.hl-a){flex-direction:column;}:where(.hl-b,.hl-c,.hl-d,.hl-e){display:flex;flex-direction:column;}}@layer htmlang{.hl-a{display:grid;grid-template-areas:"header header" "sidebar main" "footer footer";gap:20px;}.hl-b{grid-area:header;padding:10px;background:#3b82f6;color:white;}.hl-c{grid-area:sidebar;padding:10px;background:#e5e7eb;}.hl-d{grid-area:main;padding:10px;}.hl-e{grid-area:footer;padding:10px;background:#1a1a2e;color:white;}}</style></head><body><div class="hl-a"><div class="hl-b"><span>Header</span></div><div class="hl-c"><span>Sidebar</span></div><div class="hl-d"><span>Main content</span></div><div class="hl-e"><span>Footer</span></div></div></body></html>
