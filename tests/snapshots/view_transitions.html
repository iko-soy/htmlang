<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>View Transitions</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer htmlang{:where(.hl-a,.hl-b,.hl-c){display:flex;flex-direction:column;}.hl-a{gap:20px;padding:20px;}.hl-b{view-transition-name:hero;padding:20px;background:#3b82f6;color:white;border-radius:8px;}.hl-c{view-transition-name:sidebar;padding:10px;}}</style></head><body><div class="hl-a"><div class="hl-b"><span>Hero element</span></div><div class="hl-c"><span>Sidebar element</span></div></div></body></html>
