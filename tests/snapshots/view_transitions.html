<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>View Transitions</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;gap:20px;padding:20px;}.b{display:flex;flex-direction:column;view-transition-name:hero;padding:20px;background:#3b82f6;color:white;border-radius:8px;}.c{display:flex;flex-direction:column;view-transition-name:sidebar;padding:10px;}}</style></head><body><div class="a"><div class="b"><span>Hero element</span></div><div class="c"><span>Sidebar element</span></div></div></body></html>
