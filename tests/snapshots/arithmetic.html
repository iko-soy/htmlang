<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arithmetic</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;width:20px;}.b{display:flex;flex-direction:column;padding:15px;}.c{display:flex;flex-direction:column;margin:70px;}.d{display:flex;flex-direction:column;height:50px;}}</style></head><body><div class="a"><span>double is 20</span></div><div class="b"><span>sum is 15</span></div><div class="c"><span>diff is 70</span></div><div class="d"><span>half is 50</span></div></body></html>
