<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>One CSS path</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}:where([class^="hl-"],[class*=" hl-"]):where(a,button,input,select,textarea):focus-visible{outline:2px solid currentColor;outline-offset:2px}}@layer htmlang{.hl-b{display:flex;flex-direction:column;outline:2px red;container:card / inline-size;contain:content;}.hl-c{flex-direction:column;width:calc(100% - 2 * 8px);content-visibility:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}.hl-d{margin:0;}.hl-e{display:flex;flex-direction:column;margin:0;padding-left:0;list-style:none;}.hl-f{display:flex;flex-direction:column;}.hl-g{text-decoration:none;color:inherit;}.hl-a:focus{outline:2px solid var(--brand);}}</style></head><body><input class="hl-a" type="email" aria-label="Email"><div class="hl-b"><span>An outline without a style draws none</span></div><div class="hl-c"><span>Values are CSS's</span></div><h2 class="hl-d">Defaults stay on htmlang's elements</h2><ul class="hl-e"><li class="hl-f"><span>No marker</span></li></ul><a href="/home" class="hl-g">Home</a><ul>
<li>keeps its bullet and <a href="/x">its underline</a></li>
</ul>
<dialog class="hl-f"><span>A closed dialog stays hidden</span></dialog><div class="hl-f" hidden><span>So does a hidden element</span></div></body></html>
