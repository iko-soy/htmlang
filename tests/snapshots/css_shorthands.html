<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSS Shorthands</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer htmlang{:where(.hl-a,.hl-d,.hl-e,.hl-f,.hl-h,.hl-i,.hl-k){display:flex;flex-direction:column;}:where(.hl-c){margin:0;}:where(.hl-g){display:flex;flex-direction:row;}.hl-a,.hl-g{gap:20px;}.hl-b{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}.hl-c{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}.hl-d{filter:blur(4px);padding:20px;}.hl-e{backdrop-filter:blur(10px);padding:20px;background:rgba(255,255,255,0.5);}.hl-f{overflow-x:auto;scrollbar-width:none;max-width:300px;}.hl-h{width:200px;padding:20px;}.hl-i{background:linear-gradient(#3b82f6,#8b5cf6);padding:20px;border-radius:8px;}.hl-j{color:white;}.hl-k{background:linear-gradient(45deg,#ff6b6b,#feca57);padding:20px;border-radius:8px;}}</style></head><body><div class="hl-a"><span class="hl-b">This text will be truncated with an ellipsis</span><p class="hl-c">This is a long paragraph that spans multiple lines and should be clamped at three lines.</p><div class="hl-d"><span>Blurred content</span></div><div class="hl-e"><span>Frosted glass effect</span></div><div class="hl-f"><div class="hl-g"><div class="hl-h"><span>Item 1</span></div><div class="hl-h"><span>Item 2</span></div><div class="hl-h"><span>Item 3</span></div></div></div><div class="hl-i"><span class="hl-j">Gradient background</span></div><div class="hl-k"><span class="hl-j">Angled gradient</span></div></div></body></html>
