<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Colour variants</title><style>@layer hl-reset,hl-kind,hl-inside,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}:where([class^="hl-"],[class*=" hl-"]):where(a,button,input,select,textarea):focus-visible{outline:2px solid currentColor;outline-offset:2px}}:root{--brand:#3b82f6;--radius:8px;}@layer hl-kind{:where(.hl-b){text-decoration:none;color:inherit;}:where(.hl-c){display:flex;flex-direction:row;}:where(.hl-d,.hl-e,.hl-f,.hl-g,.hl-h,.hl-i,.hl-j){display:flex;flex-direction:column;}}@layer htmlang{.hl-b{background:var(--brand);border-radius:var(--radius);}.hl-d{background:color-mix(in srgb, var(--brand), black 0%);}.hl-e{background:color-mix(in srgb, var(--brand), black 10%);}.hl-f{background:color-mix(in srgb, var(--brand), black 20%);}.hl-g{background:color-mix(in srgb, var(--brand), black 30%);}.hl-h{background:color-mix(in srgb, var(--brand), white 20%);}.hl-i{background:rgb(from var(--brand) r g b / 0.2);}.hl-j{background:color-mix(in srgb, var(--brand), #f43f5e 50%);}.hl-b:hover{background:color-mix(in srgb, var(--brand), black 8%);}@media(prefers-color-scheme:dark){.hl-a{--brand:#60a5fa;}}}</style></head><body class="hl-a"><a href="/signup" class="hl-b">Sign up</a><div class="hl-c"><div class="hl-d"><span>darken 0%</span></div><div class="hl-e"><span>darken 10%</span></div><div class="hl-f"><span>darken 20%</span></div><div class="hl-g"><span>darken 30%</span></div><div class="hl-h"><span>lighten 20%</span></div><div class="hl-i"><span>alpha 0.2</span></div><div class="hl-j"><span>mix</span></div></div></body></html>
