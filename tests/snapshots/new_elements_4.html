<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New Elements 4</title><style>@layer hl-reset,hl-kind,hl-inside,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer hl-kind{:where(.hl-a){display:grid;}:where(.hl-b,.hl-c,.hl-d,.hl-e,.hl-f,.hl-g,.hl-j){display:flex;flex-direction:column;}:where(.hl-i,.hl-k){display:flex;flex-direction:row;}}@layer htmlang{.hl-a{grid-template-columns:repeat(3,1fr);gap:16px;}.hl-b{background:#f0f0f0;padding:16px;}.hl-c{background:#e0e0e0;padding:16px;}.hl-d{background:#d0d0d0;padding:16px;}.hl-e{position:relative;width:200px;height:200px;}.hl-f{position:absolute;inset:0;background:#3b82f6;}.hl-g{position:absolute;bottom:10px;right:10px;}.hl-h{color:white;}.hl-i{height:100px;}.hl-j{flex:1;}.hl-k{gap:16px;}.hl-l{text-decoration:underline;}}</style></head><body><div class="hl-a"><div class="hl-b"><span>First</span></div><div class="hl-c"><span>Second</span></div><div class="hl-d"><span>Third</span></div></div><div class="hl-e"><div class="hl-f"></div><div class="hl-g"><span class="hl-h">Overlay</span></div></div><div class="hl-i"><span>Left</span><div class="hl-j"></div><span>Right</span></div><div class="hl-k"><span class="hl-l" title="Hover me for info">Helpful text</span></div></body></html>
