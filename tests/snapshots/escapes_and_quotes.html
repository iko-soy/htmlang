<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Escapes $5 \&amp; quotes</title><meta name="description" content="Commas, quotes and backslashes"><style>@layer hl-reset,hl-kind,hl-inside,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer hl-kind{:where(.hl-a,.hl-e,.hl-f){display:flex;flex-direction:column;}:where(.hl-d){flex-direction:column;}:where(.hl-g){margin:0;}}@layer htmlang{.hl-a{transition:opacity 0.3s, transform 0.3s;font-family:"Open Sans", sans-serif;}.hl-d{display:grid;grid-template-areas:"head head" "side main";}.hl-e,.hl-f{padding:8px;}.hl-b::before{content:"\201C";}.hl-c::before,.hl-f::before{content:"→ ";}.hl-e::before{content:"*";}.hl-b::after{content:"\201D";}.hl-e::after,.hl-f::after{content:" — Fast, simple";}}</style></head><body><div class="hl-a"><span class="hl-b">A quotation</span><span class="hl-c">An arrow, with its quotes kept in CSS: → </span><div class="hl-d"></div><input type="text" pattern="\d{3}-\d{4}" title="Costs $5" aria-label="Phone, US"><div class="hl-e"><span>Fast, simple</span></div><div class="hl-f"><span>Fast, simple</span></div><p class="hl-g">Braces <mark>{and}</mark> brackets [x], a comma, a quote &quot; and \</p><span>one, two</span><span>three</span></div></body></html>
