<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Escapes $5 \&amp; quotes</title><meta name="description" content="Commas, quotes and backslashes"><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;transition:opacity 0.3s, transform 0.3s;font-family:"Open Sans", sans-serif;}.d{flex-direction:column;display:grid;grid-template-areas:"head head" "side main";}.e,.f{display:flex;flex-direction:column;padding:8px;}.g{margin:0;}.b::before{content:"\201C";}.c::before,.f::before{content:"→ ";}.e::before{content:"*";}.b::after{content:"\201D";}.e::after,.f::after{content:" — Fast, simple";}}</style></head><body><div class="a"><span class="b">A quotation</span><span class="c">An arrow, with its quotes kept in CSS: → </span><div class="d"></div><input type="text" pattern="\d{3}-\d{4}" title="Costs $5" aria-label="Phone, US"><div class="e"><span>Fast, simple</span></div><div class="f"><span>Fast, simple</span></div><p class="g">Braces <mark>{and}</mark> brackets [x], a comma, a quote &quot; and \</p><span>one, two</span><span>three</span></div></body></html>
