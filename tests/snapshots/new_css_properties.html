<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New CSS Properties</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}:where([class^="hl-"],[class*=" hl-"]):where(a,button,input,select,textarea):focus-visible{outline:2px solid currentColor;outline-offset:2px}}@layer htmlang{.hl-a{display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;}.hl-b{display:flex;flex-direction:column;position:absolute;inset:0;}.hl-c{accent-color:#3b82f6;}.hl-d{caret-color:red;}.hl-e{display:flex;flex-direction:column;margin:0;padding-left:0;list-style:disc;}.hl-f{display:flex;flex-direction:column;}.hl-g{border-collapse:collapse;border-spacing:0;}.hl-h{text-decoration:underline;text-decoration-color:red;text-decoration-thickness:2px;text-decoration-style:wavy;}.hl-i{flex-direction:column;display:grid;place-items:center;}.hl-j{display:flex;flex-direction:column;place-self:center;}.hl-k{display:flex;flex-direction:column;overflow:auto;scroll-behavior:smooth;}.hl-l{resize:vertical;}}</style></head><body><div class="hl-a"><span>Overflow</span></div><div class="hl-b"><span>Overlay</span></div><input class="hl-c" type="checkbox"><input class="hl-d" type="text"><ul class="hl-e"><li class="hl-f"><span>One</span></li><li class="hl-f"><span>Two</span></li></ul><table class="hl-g"><tr><td>Cell</td></tr></table><span class="hl-h">Decorated</span><div class="hl-i"><span>Centered</span></div><div class="hl-j"><span>Self centered</span></div><div class="hl-k"><span>Smooth scroll</span></div><textarea class="hl-l" rows="4">Resizable</textarea></body></html>
