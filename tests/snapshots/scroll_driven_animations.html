<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scroll Animation Test</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;padding:20px;}.b{display:flex;flex-direction:column;animation:fade-in linear;animation-timeline:scroll();animation-range:entry 0% cover 50%;}}@keyframes fade-in{from{opacity:0;}to{opacity:1;}}</style></head><body><div class="a"><div class="b"><span>Animated on scroll</span></div></div></body></html>
