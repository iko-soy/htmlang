<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSS Attrs</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer htmlang{.hl-a{display:flex;flex-direction:column;aspect-ratio:16/9;width:400px;background:#eee;}.hl-b{display:flex;flex-direction:column;outline:2px red;padding:10px;}.hl-c{display:flex;flex-direction:column;padding-inline:20px;padding-block:10px;}.hl-d{display:flex;flex-direction:column;margin-inline:20px;margin-block:10px;}.hl-e{display:flex;flex-direction:column;scroll-snap-type:x mandatory;overflow:scroll;}.hl-f{display:flex;flex-direction:column;scroll-snap-align:center;width:300px;}}</style></head><body><div class="hl-a"><span>Widescreen</span></div><div class="hl-b"><span>Outlined</span></div><div class="hl-c"><span>Logical padding</span></div><div class="hl-d"><span>Logical margin</span></div><div class="hl-e"><div class="hl-f"><span>Snap target</span></div></div></body></html>
