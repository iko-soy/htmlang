<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loops</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:row;gap:10px;}.b{display:flex;flex-direction:column;background:red;width:50px;height:50px;}.c{display:flex;flex-direction:column;background:green;width:50px;height:50px;}.d{display:flex;flex-direction:column;background:blue;width:50px;height:50px;}}</style></head><body><div class="a"><div class="b"></div><div class="c"></div><div class="d"></div></div><span>apple</span><span>banana</span><span>cherry</span></body></html>
