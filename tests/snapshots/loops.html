<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loops</title><style>@layer hl-reset,hl-kind,hl-inside,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer hl-kind{:where(.hl-a){display:flex;flex-direction:row;}:where(.hl-b,.hl-c,.hl-d){display:flex;flex-direction:column;}}@layer htmlang{.hl-a{gap:10px;}.hl-b{background:red;width:50px;height:50px;}.hl-c{background:green;width:50px;height:50px;}.hl-d{background:blue;width:50px;height:50px;}}</style></head><body><div class="hl-a"><div class="hl-b"></div><div class="hl-c"></div><div class="hl-d"></div></div><span>apple</span><span>banana</span><span>cherry</span></body></html>
