<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Basic Elements</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}img{display:block}a{text-decoration:none;color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid currentColor;outline-offset:2px}}@layer htmlang{.a{display:flex;flex-direction:row;gap:10px;}.b{font-weight:bold;}.c{display:flex;flex-direction:column;gap:5px;}.d{display:flex;flex-direction:column;padding:10px;}.e{margin:0;}.f{width:100px;}}</style></head><body><div class="a"><span class="b">Hello</span><span>World</span></div><div class="c"><div class="d"><span>Inner</span></div></div><p class="e">Some text here</p><img src="https://example.com/img.png" class="f"><a href="https://example.com">Click me</a></body></html>
