<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Basic Elements</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}:where([class^="hl-"],[class*=" hl-"]):where(a,button,input,select,textarea):focus-visible{outline:2px solid currentColor;outline-offset:2px}}@layer htmlang{.hl-a{display:flex;flex-direction:row;gap:10px;}.hl-b{font-weight:bold;}.hl-c{display:flex;flex-direction:column;gap:5px;}.hl-d{display:flex;flex-direction:column;padding:10px;}.hl-e{margin:0;}.hl-f{display:block;width:100px;}.hl-g{text-decoration:none;color:inherit;}}</style></head><body><div class="hl-a"><span class="hl-b">Hello</span><span>World</span></div><div class="hl-c"><div class="hl-d"><span>Inner</span></div></div><p class="hl-e">Some text here</p><img src="https://example.com/img.png" class="hl-f"><a href="https://example.com" class="hl-g">Click me</a></body></html>
