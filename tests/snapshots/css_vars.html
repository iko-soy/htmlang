<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSS Variables</title><style>@layer hl-reset,hl-kind,hl-inside,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}:root{--primary:#3b82f6;--spacing:20px;--radius:8px;}@layer hl-kind{:where(.hl-a,.hl-b,.hl-d){display:flex;flex-direction:column;}}@layer htmlang{.hl-a{gap:var(--spacing);}.hl-b{background:var(--primary);border-radius:var(--radius);padding:var(--spacing);}.hl-c{color:white;}.hl-d{border:1px solid var(--primary);border-radius:var(--radius);padding:var(--spacing);}.hl-e{color:var(--primary);}}</style></head><body><div class="hl-a"><div class="hl-b"><span class="hl-c">Using CSS vars</span></div><div class="hl-d"><span class="hl-e">Border with var</span></div></div></body></html>
