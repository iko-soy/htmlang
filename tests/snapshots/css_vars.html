<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSS Variables</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}img{display:block}a{text-decoration:none;color:inherit}}:root{--primary:#3b82f6;--spacing:20;--radius:8;}@layer htmlang{.a{display:flex;flex-direction:column;gap:20px;}.b{display:flex;flex-direction:column;background:var(--primary);border-radius:8px;padding:20px;}.c{color:white;}.d{display:flex;flex-direction:column;border:1px solid var(--primary);border-radius:8px;padding:20px;}.e{color:var(--primary);}}</style></head><body><div class="a"><div class="b"><span class="c">Using CSS vars</span></div><div class="d"><span class="e">Border with var</span></div></div></body></html>
