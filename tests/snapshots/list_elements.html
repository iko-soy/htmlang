<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>List Elements</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer htmlang{.hl-a{display:flex;flex-direction:column;margin:0;padding-left:0;list-style:none;gap:8px;}.hl-b{display:flex;flex-direction:column;}.hl-c{display:flex;flex-direction:column;margin:0;padding-left:0;list-style:none;gap:4px;}.hl-d{display:flex;flex-direction:column;margin:0;padding-left:0;list-style:none;}.hl-e{display:flex;flex-direction:column;padding:10px;background:#f0f0f0;border-radius:4px;}.hl-f{font-weight:bold;}}</style></head><body><ul class="hl-a"><li class="hl-b"><span>First item</span></li><li class="hl-b"><span>Second item</span></li><li class="hl-b"><span>Third item</span></li></ul><ol class="hl-c"><li class="hl-b"><span>Step one</span></li><li class="hl-b"><span>Step two</span></li><li class="hl-b"><span>Step three</span></li></ol><ul class="hl-d"><li class="hl-e"><span class="hl-f">Styled item</span></li></ul></body></html>
