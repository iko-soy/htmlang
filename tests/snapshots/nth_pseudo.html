<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nth Pseudo</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;gap:4px;}.b{display:flex;flex-direction:column;padding:8px;}.c{display:flex;flex-direction:row;gap:4px;flex-wrap:wrap;}.d{display:flex;flex-direction:column;padding:12px;background:#f0f0f0;}.b:nth-child(3){background:#3b82f6;color:white;}.d:nth-child(2n){background:#e0e0e0;}}</style></head><body><div class="a"><div class="b"><span>Item 1</span></div><div class="b"><span>Item 2</span></div><div class="b"><span>Item 3</span></div><div class="b"><span>Item 4</span></div><div class="b"><span>Item 5</span></div></div><div class="c"><div class="d"><span>1</span></div><div class="d"><span>2</span></div><div class="d"><span>3</span></div><div class="d"><span>4</span></div><div class="d"><span>5</span></div><div class="d"><span>6</span></div><div class="d"><span>7</span></div><div class="d"><span>8</span></div></div></body></html>
