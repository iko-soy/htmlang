<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Container Test</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;container-type:inline-size;container-name:sidebar;}.b{display:flex;flex-direction:column;width:200px;}.c{display:flex;flex-direction:column;container-type:inline-size;max-width:800px;padding:20px;}.d{display:flex;flex-direction:column;background:#f0f0f0;padding:16px;}@container(min-width:640px){.d{padding:24px;}}@container(min-width:1024px){.d{padding:32px;}}}</style></head><body><div class="a"><div class="b"><span>Sidebar content</span></div></div><div class="c"><div class="d"><span>Responsive to container width</span></div></div></body></html>
