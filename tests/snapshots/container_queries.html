<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Container Test</title><style>@layer hl-reset,hl-kind,hl-inside,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer hl-kind{:where(.hl-a,.hl-b,.hl-c,.hl-d){display:flex;flex-direction:column;}}@layer htmlang{.hl-a{container-type:inline-size;container-name:sidebar;}.hl-b{width:200px;}.hl-c{container-type:inline-size;max-width:800px;padding:20px;}.hl-d{background:#f0f0f0;padding:16px;}@container(min-width:640px){.hl-d{padding:24px;}}@container(min-width:1024px){.hl-d{padding:32px;}}}</style></head><body><div class="hl-a"><div class="hl-b"><span>Sidebar content</span></div></div><div class="hl-c"><div class="hl-d"><span>Responsive to container width</span></div></div></body></html>
