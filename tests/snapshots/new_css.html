<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New CSS</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;margin:10px;margin-inline:20px;margin-block:30px;}.b{width:200px;height:200px;object-fit:cover;object-position:center;}.c{display:flex;flex-direction:column;filter:blur(5px);pointer-events:none;user-select:none;}.d{display:flex;flex-direction:row;justify-content:space-between;align-items:center;}.e{display:flex;flex-direction:column;order:2;}.f{display:flex;flex-direction:column;background:url(bg.jpg);background-size:cover;background-position:center;background-repeat:no-repeat;}.g{text-shadow:1px 1px 2px black;text-overflow:ellipsis;}.h{display:flex;flex-direction:column;word-break:break-all;overflow-wrap:break-word;}}</style></head><body><div class="a"><span>Margins</span></div><img src="photo.jpg" class="b"><div class="c"><span>Filtered</span></div><div class="d"><span>Left</span><span>Right</span></div><div class="e"><span>Second</span></div><div class="f"><span>Background</span></div><span class="g">Shadowed</span><div class="h"><span>Longtext</span></div></body></html>
