<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New CSS</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer htmlang{.hl-a{display:flex;flex-direction:column;margin:10px;margin-inline:20px;margin-block:30px;}.hl-b{display:block;width:200px;height:200px;object-fit:cover;object-position:center;}.hl-c{display:flex;flex-direction:column;filter:blur(5px);pointer-events:none;user-select:none;}.hl-d{display:flex;flex-direction:row;justify-content:space-between;align-items:center;}.hl-e{display:flex;flex-direction:column;order:2;}.hl-f{display:flex;flex-direction:column;background:url(bg.jpg);background-size:cover;background-position:center;background-repeat:no-repeat;}.hl-g{text-shadow:1px 1px 2px black;text-overflow:ellipsis;}.hl-h{display:flex;flex-direction:column;word-break:break-all;overflow-wrap:break-word;}}</style></head><body><div class="hl-a"><span>Margins</span></div><img src="photo.jpg" class="hl-b"><div class="hl-c"><span>Filtered</span></div><div class="hl-d"><span>Left</span><span>Right</span></div><div class="hl-e"><span>Second</span></div><div class="hl-f"><span>Background</span></div><span class="hl-g">Shadowed</span><div class="hl-h"><span>Longtext</span></div></body></html>
