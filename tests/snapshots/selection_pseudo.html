<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Selection Pseudo</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{margin:0;}.b{display:flex;flex-direction:column;gap:16px;}.a::selection{background:#3b82f6;color:white;}.c::selection{background:#ef4444;color:white;}.d::selection{background:#22c55e;color:black;}}</style></head><body><p class="a">Select this text to see custom selection colors.</p><div class="b"><span class="c">Red selection</span><span class="d">Green selection</span></div></body></html>
