<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animations</title><style>@layer hl-reset,hl-kind,hl-inside,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer hl-kind{:where(.hl-a,.hl-b,.hl-c){display:flex;flex-direction:column;}}@layer htmlang{.hl-a{gap:20px;}.hl-b{animation:fade-in 0.3s ease;}.hl-c{animation:slide-up 0.5s ease-out;}}@keyframes fade-in {from{opacity:0}to{opacity:1}}@keyframes slide-up {0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}</style></head><body><div class="hl-a"><div class="hl-b"><span>Fading in</span></div><div class="hl-c"><span>Sliding up</span></div></div></body></html>
