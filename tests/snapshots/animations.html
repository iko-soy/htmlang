<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animations</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;gap:20px;}.b{display:flex;flex-direction:column;animation:fade-in 0.3s ease;}.c{display:flex;flex-direction:column;animation:slide-up 0.5s ease-out;}}@keyframes fade-in {from{opacity:0}to{opacity:1}}@keyframes slide-up {0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}</style></head><body><div class="a"><div class="b"><span>Fading in</span></div><div class="c"><span>Sliding up</span></div></div></body></html>
