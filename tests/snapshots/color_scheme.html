<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Color Scheme</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;color-scheme:light dark;padding:20px;}.b{appearance:none;padding:10px;border:1px solid #ccc;border-radius:4px;}}</style></head><body><div class="a"><span>Adapts to system theme</span></div><input class="b"></body></html>
