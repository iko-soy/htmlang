<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New CSS Properties 3</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;gap:20px;}.b{font-weight:600;}.c{font-style:oblique;}.d{text-wrap:balance;font-size:32px;}.e{display:flex;flex-direction:column;will-change:transform;transition:transform 0.3s ease;}.f{display:flex;flex-direction:column;touch-action:none;}.g{vertical-align:middle;}.h{display:flex;flex-direction:column;contain:content;}.i{display:flex;flex-direction:column;scroll-margin-top:80px;}.j{display:flex;flex-direction:column;content-visibility:auto;}.k{display:flex;flex-direction:column;scroll-padding:20px;}}</style></head><body><div class="a"><span class="b">Semi-bold text</span><span class="c">Oblique text</span><span class="d">A heading that wraps nicely</span><div class="e"><span>Optimized for animation</span></div><div class="f"><span>No touch scrolling</span></div><span class="g">Middle aligned</span><div class="h"><span>Contained element</span></div><div class="i"><span>Offset for fixed header</span></div><div class="j"><span>Lazy rendered content</span></div><div class="k"><span>Scroll padding container</span></div></div></body></html>
