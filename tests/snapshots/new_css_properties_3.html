<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New CSS Properties 3</title><style>@layer hl-reset,hl-kind,hl-inside,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer hl-kind{:where(.hl-a,.hl-e,.hl-f,.hl-h,.hl-i,.hl-j,.hl-k){display:flex;flex-direction:column;}}@layer htmlang{.hl-a{gap:20px;}.hl-b{font-weight:600;}.hl-c{font-style:oblique;}.hl-d{text-wrap:balance;font-size:32px;}.hl-e{will-change:transform;transition:transform 0.3s ease;}.hl-f{touch-action:none;}.hl-g{vertical-align:middle;}.hl-h{contain:content;}.hl-i{scroll-margin-top:80px;}.hl-j{content-visibility:auto;}.hl-k{scroll-padding:20px;}}</style></head><body><div class="hl-a"><span class="hl-b">Semi-bold text</span><span class="hl-c">Oblique text</span><span class="hl-d">A heading that wraps nicely</span><div class="hl-e"><span>Optimized for animation</span></div><div class="hl-f"><span>No touch scrolling</span></div><span class="hl-g">Middle aligned</span><div class="hl-h"><span>Contained element</span></div><div class="hl-i"><span>Offset for fixed header</span></div><div class="hl-j"><span>Lazy rendered content</span></div><div class="hl-k"><span>Scroll padding container</span></div></div></body></html>
