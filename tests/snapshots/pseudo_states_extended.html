<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pseudo States Extended</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer htmlang{:where(.hl-a,.hl-b,.hl-d,.hl-f){display:flex;flex-direction:column;}:where(.hl-e){display:flex;flex-direction:row;}.hl-a,.hl-f{padding:10px;}.hl-e{gap:10px;}.hl-a:focus-visible{border:2px solid blue;}.hl-a:focus-within{background:#eee;}.hl-b:disabled{opacity:0.5;}.hl-b:checked{background:green;}.hl-c::placeholder{color:#999;}.hl-d:first-child{border-top:0;}.hl-d:last-child{border-bottom:0;}.hl-f:nth-child(odd){background:#f5f5f5;}.hl-f:nth-child(even){background:white;}}</style></head><body><div class="hl-a"><input type="text" placeholder="Name"></div><div class="hl-b"></div><input class="hl-c" type="text"><div class="hl-d"></div><div class="hl-e"><div class="hl-f"><span>Item</span></div></div></body></html>
