<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Animate</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;gap:20px;padding:20px;}.b{display:flex;flex-direction:column;animation:fade-in 0.3s ease;padding:20px;}.c{display:flex;flex-direction:column;animation:slide-up 0.5s ease-out;padding:20px;background:#e5e7eb;}}@keyframes fade-in {from { opacity: 0; }to { opacity: 1; }}@keyframes slide-up {from { transform: translateY(20px); opacity: 0; }to { transform: translateY(0); opacity: 1; }}</style></head><body><div class="a"><div class="b"><span>Faded in</span></div><div class="c"><span>Slid up</span></div></div></body></html>
