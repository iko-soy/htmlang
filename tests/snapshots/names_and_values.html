<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Names and values</title><style>@layer hl-reset,hl-kind,hl-inside,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer hl-kind{:where(.hl-a,.hl-b,.hl-c,.hl-d,.hl-f,.hl-g,.hl-h){display:flex;flex-direction:column;}:where(.hl-e){display:flex;flex-direction:row;}:where(.hl-i){display:block;}}@layer htmlang{.hl-a{max-width:none;z-index:auto;opacity:50%;color:rebeccapurple;width:fit-content;}.hl-b{--gap:12px;gap:var(--gap);-webkit-tap-highlight-color:transparent;}.hl-c{width:if(media(width > 40em): 50%; else: 100%);background:url(data:image/gif;base64,R0lGODlhAQABAAAAACw=);}.hl-d{margin-top:8px;}.hl-f{flex:1;min-width:0;}.hl-h{width:100%;}.hl-i{width:200px;}.hl-b:hover{--gap:16px;}.hl-d::before{content:"a;b{}";}}</style></head><body><div class="hl-a"><span>Values are the browser's to judge</span></div><div class="hl-b"><span>Custom and vendor-prefixed properties, as written</span></div><div class="hl-c"><span>A `;` inside parentheses is CSS's own</span></div><div class="hl-d"><span>Hello by Ada</span></div><div class="hl-e"><div class="hl-f"><span>Fills the row</span></div></div><div class="hl-g"><div class="hl-h"><span>The full width of a column</span></div></div><img src="photo.jpg" class="hl-i" width="800" alt="A photo"><div class="hl-g" hidden><span>Hidden</span></div><script src="app.js" type="module" data-page="home" defer></script></body></html>
