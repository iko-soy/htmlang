<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Direction</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;direction:rtl;padding:20px;}.b{display:flex;flex-direction:column;direction:ltr;padding:20px;}}</style></head><body><div class="a"><span>This text should be right-to-left</span></div><div class="b"><span>This text is explicitly left-to-right</span></div></body></html>
