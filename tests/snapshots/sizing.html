<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sizing</title><style>@layer hl-reset,hl-kind,hl-inside,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer hl-kind{:where(.hl-a){display:flex;flex-direction:row;}:where(.hl-b,.hl-c,.hl-d,.hl-e,.hl-f,.hl-g){display:flex;flex-direction:column;}}@layer htmlang{.hl-a{height:200px;}.hl-b{flex:1;min-width:0;background:#eee;}.hl-c{width:100px;background:#ddd;}.hl-d{flex-shrink:0;background:#ccc;}.hl-e{width:400px;}.hl-f{flex:1;min-height:0;background:#eee;}.hl-g{height:50px;background:#ddd;}}</style></head><body><div class="hl-a"><div class="hl-b"><span>Fill width</span></div><div class="hl-c"><span>Fixed 100</span></div><div class="hl-d"><span>Shrink</span></div></div><div class="hl-e"><div class="hl-f"><span>Fill height</span></div><div class="hl-g"><span>Fixed 50</span></div></div></body></html>
