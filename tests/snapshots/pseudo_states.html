<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pseudo States</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;background:white;transition:all 0.2s;}.b{color:black;}.a:hover{background:#eee;}.b:hover{color:blue;}.a:active{background:#ddd;}.a:focus{background:#ccc;}}</style></head><body><div class="a"><span class="b">Hover me</span></div></body></html>
