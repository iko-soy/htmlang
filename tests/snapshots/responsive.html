<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Responsive</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer htmlang{:where(.hl-a){display:flex;flex-direction:row;}:where(.hl-b,.hl-d){display:flex;flex-direction:column;}.hl-a{gap:10px;}.hl-b{flex:1;min-width:0;}.hl-c{font-size:14px;}.hl-d{padding:10px;}@media(min-width:640px){.hl-a{gap:20px;}.hl-b{width:200px;}.hl-d{padding:20px;}}@media(min-width:768px){.hl-b{width:300px;}.hl-c{font-size:18px;}}@media(min-width:1024px){.hl-a{gap:40px;}.hl-b{width:400px;}.hl-c{font-size:24px;}}@media(min-width:1280px){.hl-b{width:500px;}}}</style></head><body><div class="hl-a"><div class="hl-b"><span class="hl-c">Responsive text</span></div><div class="hl-d"></div></div></body></html>
