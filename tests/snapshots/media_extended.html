<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Media Extended</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;width:100%;}.b{display:flex;flex-direction:column;transition:all 0.3s ease;}.c{display:flex;flex-direction:column;animation:spin 1s linear infinite;}.d{display:flex;flex-direction:column;padding:20px;}@media(min-width:1536px){.a{width:1536px;padding:40px;}}@media(prefers-reduced-motion:no-preference){.c{animation:spin 1s linear infinite;}}@media(prefers-reduced-motion:reduce){.b{transition:none;}.c{animation:none;}}@media(orientation:landscape){.d{padding:10px;}}@media(orientation:portrait){.d{padding:40px;}}}</style></head><body><div class="a"><span>Wide screen layout</span></div><div class="b"><span>Respects motion preferences</span></div><div class="c"><span>Animation with motion safety</span></div><div class="d"><span>Orientation-aware padding</span></div></body></html>
