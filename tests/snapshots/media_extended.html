<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Media Extended</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer htmlang{.hl-a{display:flex;flex-direction:column;width:100%;}.hl-b{display:flex;flex-direction:column;transition:all 0.3s ease;}.hl-c{display:flex;flex-direction:column;animation:spin 1s linear infinite;}.hl-d{display:flex;flex-direction:column;padding:20px;}@media(min-width:1536px){.hl-a{width:1536px;padding:40px;}}@media(prefers-reduced-motion:no-preference){.hl-c{animation:spin 1s linear infinite;}}@media(prefers-reduced-motion:reduce){.hl-b{transition:none;}.hl-c{animation:none;}}@media(orientation:landscape){.hl-d{padding:10px;}}@media(orientation:portrait){.hl-d{padding:40px;}}}</style></head><body><div class="hl-a"><span>Wide screen layout</span></div><div class="hl-b"><span>Respects motion preferences</span></div><div class="hl-c"><span>Animation with motion safety</span></div><div class="hl-d"><span>Orientation-aware padding</span></div></body></html>
