<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Each Step</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;gap:4px;}.b{display:flex;flex-direction:row;gap:8px;}.c{display:flex;flex-direction:column;width:50px;height:50px;background:#3b82f6;border-radius:4px;}.d{color:white;font-size:12px;}}</style></head><body><div class="a"><span>Value: 0</span><span>Value: 5</span><span>Value: 10</span><span>Value: 15</span><span>Value: 20</span></div><div class="b"><div class="c"><span class="d">0</span></div><div class="c"><span class="d">25</span></div><div class="c"><span class="d">50</span></div><div class="c"><span class="d">75</span></div><div class="c"><span class="d">100</span></div></div><div class="a"><span>Countdown: 10</span><span>Countdown: 8</span><span>Countdown: 6</span><span>Countdown: 4</span><span>Countdown: 2</span></div></body></html>
