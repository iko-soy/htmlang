<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Each Step</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer htmlang{.hl-a{display:flex;flex-direction:column;gap:4px;}.hl-b{display:flex;flex-direction:row;gap:8px;}.hl-c{display:flex;flex-direction:column;width:50px;height:50px;background:#3b82f6;border-radius:4px;}.hl-d{color:white;font-size:12px;}}</style></head><body><div class="hl-a"><span>Value: 0</span><span>Value: 5</span><span>Value: 10</span><span>Value: 15</span><span>Value: 20</span></div><div class="hl-b"><div class="hl-c"><span class="hl-d">0</span></div><div class="hl-c"><span class="hl-d">25</span></div><div class="hl-c"><span class="hl-d">50</span></div><div class="hl-c"><span class="hl-d">75</span></div><div class="hl-c"><span class="hl-d">100</span></div></div><div class="hl-a"><span>Countdown: 10</span><span>Countdown: 8</span><span>Countdown: 6</span><span>Countdown: 4</span><span>Countdown: 2</span></div></body></html>
