<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSS Units</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer htmlang{:where(.hl-a,.hl-b,.hl-d,.hl-e){display:flex;flex-direction:column;}.hl-a{padding:2rem;gap:1.5em;}.hl-b{width:50%;height:100vh;max-width:80ch;}.hl-c{font-size:1.2rem;}.hl-d{padding:10px 2rem;border-radius:0.5rem;}.hl-e{min-height:50vh;gap:2rem;}}</style></head><body><div class="hl-a"><div class="hl-b"><span class="hl-c">Hello</span></div><div class="hl-d"><span>Responsive padding</span></div><div class="hl-e"><span>Viewport units</span></div></div></body></html>
