<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dark Mode</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}:where([class^="hl-"],[class*=" hl-"]):where([hidden]:not([hidden="until-found"]),dialog:not([open]):not(:popover-open),[popover]:not(:popover-open):not(dialog[open])){display:none!important}}@layer htmlang{:where(.hl-a,.hl-c,.hl-d){display:flex;flex-direction:column;}.hl-a{background:white;color:#333;padding:20px;}.hl-b{font-size:24px;font-weight:bold;}.hl-c{border:1px solid #ccc;border-radius:8px;padding:16px;}.hl-d{background:#f0f0f0;padding:10px;}@media(prefers-color-scheme:dark){.hl-a{background:#1a1a2e;color:#eee;}.hl-c{border:1px solid #444;}.hl-d{background:#333;}}@media print{.hl-d{display:none;}}}</style></head><body><div class="hl-a"><span class="hl-b">Hello World</span></div><div class="hl-c"><span>Theme-aware card</span></div><div class="hl-d"><span>Not printed</span></div></body></html>
