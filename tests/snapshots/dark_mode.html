<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dark Mode</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;background:white;color:#333;padding:20px;}.b{font-size:24px;font-weight:bold;}.c{display:flex;flex-direction:column;border:1px solid #ccc;border-radius:8px;padding:16px;}.d{display:flex;flex-direction:column;background:#f0f0f0;padding:10px;}@media(prefers-color-scheme:dark){.a{background:#1a1a2e;color:#eee;}.c{border:1px solid #444;}.d{background:#333;}}@media print{.d{display:none;}}}</style></head><body><div class="a"><span class="b">Hello World</span></div><div class="c"><span>Theme-aware card</span></div><div class="d"><span>Not printed</span></div></body></html>
