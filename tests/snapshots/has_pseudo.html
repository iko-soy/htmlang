<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Has Pseudo</title><style>@layer hl-reset,htmlang;@layer hl-reset{*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif}img{display:block}a{text-decoration:none;color:inherit}}@layer htmlang{.a{display:flex;flex-direction:column;gap:20px;padding:20px;}.b{display:flex;flex-direction:column;padding:20px;background:white;}.c{display:flex;flex-direction:column;border:1px solid #e5e7eb;border-radius:8px;}.b:has(.active){background:#dbeafe;}.b:has(img){padding:0;}.c:has(.selected){border:2px solid #3b82f6;}}</style></head><body><div class="a"><div class="b"><span>Content</span></div><div class="c"><span>Container</span></div></div></body></html>
